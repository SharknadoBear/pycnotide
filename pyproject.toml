[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pycnotide"
version = "0.1.0.dev0"
description = "Harmonic analysis and reconstruction of coherent internal tides from moving hydrographic profiles."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Huan Huang"}]
keywords = ["internal tides", "oceanography", "harmonic analysis", "glider"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
guam = [
  "xarray>=2024.1",
  "netCDF4>=1.6",
  "gsw>=3.6",
  "pyproj>=3.6",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "jinja2>=3.1",
  "podaac-data-subscriber>=1.15",
]
test = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "xarray>=2024.1",
  "build>=1.2",
  # podaac-data-subscriber currently constrains packaging<24.
  "wheel<0.43",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pycnotide"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
